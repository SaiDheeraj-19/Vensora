services:
  postgres:
    image: postgres:16-alpine
    container_name: vensora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vensora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vensora_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vensora}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vensora} -d $${POSTGRES_DB:-vensora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vensora_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vensora_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vensora_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vensora_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: vensora_minio_init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/init-minio.sh:/init-minio.sh
    entrypoint: /bin/sh -c "chmod +x /init-minio.sh && /init-minio.sh"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vensora_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vensora_minio_secret}

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vensora_qdrant
    restart: always
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
